spring:
  application:
    name: tianji-agent-server
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - top.egon.cola.component.rpc.tianshu.autoconfigure.DdcRpcAutoConfiguration
  main:
    web-application-type: none
  flyway:
    enabled: false
  sql:
    init:
      mode: never

egon:
  cola:
    component:
      transactional-outbox:
        enabled: false
      id:
        enabled: false
      agent-flow:
        legacy-static-workflow:
          enabled: false
      tianshu:
        si:
          client:
            enabled: false
            env-code: prod
            cache-ttl: 60s
            debounce-window: 2s
            fail-fast-on-startup: false
            self-registration-backoff: 200ms
    platform:
      tianquan:
        shoubing:
          register-filter: false
        jianshen:
          register-filter: false
          user-scope-policy:
            enabled: true
            permission-scopes:
              TIANJI_AGENT_START: ["tianji:agent:start"]
              TIANJI_AGENT_READ: ["tianji:agent:read"]
              TIANJI_AGENT_CANCEL: ["tianji:agent:cancel"]
              TIANJI_AGENT_CHECKPOINT_RESUME: ["tianji:agent:checkpoint-resume"]
              TIANJI_SESSION_DELETE: ["tianji:session:delete"]
              TIANJI_MEMORY_READ: ["tianji:memory:read"]
              TIANJI_MEMORY_WRITE: ["tianji:memory:write"]
              TIANJI_MEMORY_FORGET: ["tianji:memory:forget"]
              TIANJI_AGENT_TOOL_RECEIPT_RECONCILE: ["tianji:agent:tool-receipt:reconcile"]

stellar:
  tianji:
    agent:
      runtime-v2:
        enabled: false
      legacy:
        direct-start:
          enabled: false
      terminal-events:
        span-links-enabled: false
      result-delivery:
        cross-process-span-links-enabled: false
      run-observation:
        initial-claim-metrics-enabled: false
        queued-backlog-metrics-enabled: false
      storage:
        model-usage-enabled: false
        model-usage-cumulative-route-refs: []
      recovery:
        checkpoint-capture:
          enabled: false
        historical-start-receipt:
          enabled: false
      checkpoint-resume:
        api:
          enabled: false
      recovery-diagnostics:
        enabled: false
      native-templates:
        enabled: false
        model-bean-name: ""
        model-name: ""
        model-route-ref: ""
        decomposition-enabled: false
      tools:
        authority:
          enabled: false
          timeout: PT5S
          concurrency: 4
          descriptors: []
          bindings: []
        read-only-decision:
          enabled: false
          concurrency: 4
          bindings: []
        governed-process:
          enabled: false
          concurrency: 4
          decision-bindings: []
          start-bindings: []
          approval-bindings: []
          mcp-bindings: []
      memory:
        enabled: false
        extraction:
          background:
            enabled: false
          intents:
            http:
              enabled: false
          http:
            enabled: false
        merge-suggestions:
          http:
            enabled: false
        retention:
          enabled: false
        http:
          enabled: false
      model-budgets:
        enabled: false
      context:
        memory:
          enabled: false
        rag:
          enabled: false
        trimming:
          enabled: false
        snapshots:
          enabled: false
        tianshu:
          enabled: false
