spring:
  application:
    name: tianji-agent-server
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - top.egon.cola.component.rpc.tianshu.autoconfigure.DdcRpcAutoConfiguration
  main:
    web-application-type: none
  flyway:
    enabled: false
  sql:
    init:
      mode: never

egon:
  cola:
    component:
      transactional-outbox:
        enabled: false
      id:
        enabled: false
    platform:
      tianquan:
        shoubing:
          register-filter: false
        jianshen:
          register-filter: false
          user-scope-policy:
            enabled: true
            permission-scopes:
              TIANJI_AGENT_START: ["tianji:agent:start"]
              TIANJI_AGENT_READ: ["tianji:agent:read"]
              TIANJI_AGENT_CANCEL: ["tianji:agent:cancel"]
              TIANJI_SESSION_DELETE: ["tianji:session:delete"]

stellar:
  tianji:
    agent:
      model-budgets:
        enabled: false
      context:
        trimming:
          enabled: false
        snapshots:
          enabled: false
        tianshu:
          enabled: false
