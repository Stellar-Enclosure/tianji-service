spring:
  application:
    name: tianji-process-server
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  main:
    web-application-type: none
  sql:
    init:
      mode: never
  flyway:
    enabled: false

flowable:
  database-schema: tianji_process
  database-schema-update: false
  async-executor-activate: false
  async-history-executor-activate: false
  check-process-definitions: false
  cmmn:
    deploy-resources: false
  dmn:
    deploy-resources: false
  idm:
    enabled: false
  eventregistry:
    enabled: false

egon:
  cola:
    component:
      id:
        enabled: false
      transactional-outbox:
        storage:
          type: JDBC
          jdbc:
            schema: tianji_process
          validate-schema: true
        polling:
          enabled: false
    platform:
      tianquan:
        shoubing:
          register-filter: false
        jianshen:
          register-filter: false
          user-scope-policy:
            enabled: true
            permission-scopes:
              TIANJI_PROCESS_RELEASE_PUBLISH: ["tianji:process:publish"]
              TIANJI_PROCESS_RELEASE_READ: ["tianji:process:release:read"]
              TIANJI_PROCESS_START: ["tianji:process:start"]
              TIANJI_PROCESS_READ: ["tianji:process:read"]
              TIANJI_DECISION_EXECUTE: ["tianji:decision:execute"]
