spring:
  application:
    name: tianji-process-server
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  main:
    web-application-type: none
  sql:
    init:
      mode: never
  flyway:
    enabled: false

flowable:
  database-schema: tianji_process
  database-schema-update: false
  async-executor-activate: false
  async-history-executor-activate: false
  check-process-definitions: false
  cmmn:
    deploy-resources: false
  dmn:
    deploy-resources: false
  idm:
    enabled: false
  eventregistry:
    enabled: false

egon:
  cola:
    component:
      id:
        enabled: false
      transactional-outbox:
        storage:
          type: JDBC
          jdbc:
            schema: tianji_process
          validate-schema: true
        polling:
          enabled: false
    platform:
      tianquan:
        shoubing:
          register-filter: false
        jianshen:
          register-filter: false
          service-any-scope-resources: ["tianji.api.process.instance.get.v2", "tianji.api.process.node.execution.list.v2"]
          user-scope-policy:
            enabled: true
            permission-scopes:
              TIANJI_PROCESS_RELEASE_PUBLISH: ["tianji:process:publish"]
              TIANJI_PROCESS_RELEASE_READ: ["tianji:process:release:read"]
              TIANJI_PROCESS_RELEASE_ACTIVATE: ["tianji:process:activate"]
              TIANJI_PROCESS_START: ["tianji:process:start"]
              TIANJI_PROCESS_READ: ["tianji:process:read"]
              TIANJI_PROCESS_OBSERVE: ["tianji:process:observe"]
              TIANJI_PROCESS_DATA_READ: ["tianji:process:data:read"]
              TIANJI_PROCESS_DIAGNOSTIC_READ: ["tianji:process:diagnostic:read"]
              TIANJI_PROCESS_CANCEL: ["tianji:process:cancel"]
              TIANJI_PROCESS_WORKER_RECOVER: ["tianji:process:worker-recover"]
              TIANJI_DECISION_EXECUTE: ["tianji:decision:execute"]
              TIANJI_WORKER_ACQUIRE: ["tianji:worker:acquire"]
              TIANJI_WORKER_REPORT: ["tianji:worker:report"]
              TIANJI_TASK_READ: ["tianji:task:read"]
              TIANJI_TASK_CLAIM: ["tianji:task:claim"]
              TIANJI_TASK_COMPLETE: ["tianji:task:complete"]
              TIANJI_TASK_TRANSFER: ["tianji:task:transfer"]
              TIANJI_CASE_START: ["tianji:case:start"]
              TIANJI_CASE_READ: ["tianji:case:read"]
              TIANJI_CASE_PLAN_ITEM_ACT: ["tianji:case:act"]

stellar:
  tianji:
    process:
      api:
        start-receipt-read-enabled: false
      automation:
        enabled: false
      cancellation:
        enabled: false
      migration-preflight:
        enabled: false
        http-enabled: false
      worker:
        enabled: false
        registrations: []
        automation-registrations: []
      worker-recovery:
        enabled: false
      cases:
        enabled: false
        new-starts-enabled: false
        sources: []
        poll-interval: 1s
        retry-delay: 1s
        batch-size: 32
        max-failures: 10
      approval-verification:
        enabled: false
      human-tasks:
        enabled: false
        publish-enabled: false
        completion-metrics-enabled: false
      agent-results:
        receive-span-links-enabled: false
        owner-outcomes-enabled: false
        lag-metrics-enabled: false
      agent-bridge:
        enabled: false
